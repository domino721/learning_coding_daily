name: Check project planning
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate baselines, WBS, history and evidence
        env:
          PLANNING_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$PLANNING_BASE_SHA" ]; then
            PLANNING_BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          python3 scripts/planning.py check --base "$PLANNING_BASE_SHA"
          python3 -m unittest discover -s tests -p "test_planning.py"

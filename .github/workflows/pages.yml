name: Publish mobile web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate project planning before publishing
        env:
          PLANNING_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$PLANNING_BASE_SHA" ]; then
            PLANNING_BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          python3 scripts/planning.py check --base "$PLANNING_BASE_SHA"
          python3 -m unittest discover -s tests -p "test_planning.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 scripts/export-content.py --check
      - run: node --experimental-strip-types --test tests/recommendation.test.ts
      - run: npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify the public site serves this build
        env:
          PUBLISHED_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-published-site.py --site-url "$PUBLISHED_SITE_URL" --dist web-dist
